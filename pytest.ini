# Test Configuration
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')

# Coverage configuration (if using pytest-cov)
# addopts = -v --tb=short --cov=app --cov=cli --cov-report=html --cov-report=term-missing